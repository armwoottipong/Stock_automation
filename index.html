<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Submission Checklist | Minimal Editorial</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg: #faf9f6;
      --surface: #ffffff;
      --border: #e8e6e1;
      --border-subtle: #f0eee9;
      --text: #1a1b1e;
      --text-muted: #74767e;
      --text-dim: #9da0a8;
      --accent: #111214;
      --pill-checked-bg: #1c1d21;
      --pill-checked-text: #ffffff;
      --pill-unchecked-bg: #f4f3ef;
      --pill-unchecked-text: #4a4c54;
      --pill-border: #e2e0da;
      --tag-bg: #eceae4;
      --tag-text: #5c5e66;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1013;
        --surface: #15171b;
        --border: #23252b;
        --border-subtle: #1b1d22;
        --text: #edecee;
        --text-muted: #8c8f99;
        --text-dim: #5c5f69;
        --accent: #f2f2f4;
        --pill-checked-bg: #edecee;
        --pill-checked-text: #111214;
        --pill-unchecked-bg: #1a1c22;
        --pill-unchecked-text: #a8abb6;
        --pill-border: #292c34;
        --tag-bg: #1e2027;
        --tag-text: #8c8f99;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      padding: 40px 20px 80px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* Minimal Editorial Header */
    header {
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
    }

    .title-group h1 {
      font-family: "Newsreader", "Charter", "Georgia", "Iowan Old Style", serif;
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .title-group p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .header-links {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-link {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-link:hover {
      border-color: var(--text-muted);
      background: var(--surface);
    }

    /* Minimal Controls */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .filter-group {
      display: flex;
      gap: 16px;
      font-size: 14px;
    }

    .filter-item {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 0;
      font-size: 13px;
      font-weight: 500;
      position: relative;
    }

    .filter-item:hover {
      color: var(--text);
    }

    .filter-item.active {
      color: var(--text);
      font-weight: 600;
    }

    .filter-item.active::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 1.5px;
      background: var(--text);
    }

    .search-input {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      width: 200px;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--text-muted);
      width: 240px;
      background: var(--surface);
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      user-select: none;
    }

    .sort-btn:hover {
      border-color: var(--text-muted);
      color: var(--text);
      background: var(--surface);
    }

    /* Todo List */
    .todo-list {
      display: flex;
      flex-direction: column;
    }

    .todo-row {
      padding: 20px 0;
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.1s ease;
    }

    .todo-row:last-child {
      border-bottom: none;
    }

    .todo-meta-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .set-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .set-id:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .todo-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      cursor: pointer;
      display: inline-block;
      transition: color 0.15s ease;
      word-break: break-all;
    }

    .todo-title:hover {
      color: var(--accent);
    }

    .todo-row.all-done .todo-title {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    /* Minimal Checkbox Pills */
    .platforms-checklist {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .check-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      background: var(--pill-unchecked-bg);
      color: var(--pill-unchecked-text);
      border: 1px solid var(--pill-border);
      transition: all 0.15s ease;
    }

    .check-pill:hover {
      border-color: var(--text-muted);
    }

    .check-pill.checked {
      background: var(--pill-checked-bg);
      color: var(--pill-checked-text);
      border-color: transparent;
    }

    .check-pill input {
      display: none;
    }

    .check-icon {
      width: 12px;
      height: 12px;
      stroke-width: 2.5;
      stroke: currentColor;
      fill: none;
      display: none;
    }

    .check-pill.checked .check-icon {
      display: inline-block;
    }

    .sub-date {
      font-size: 11px;
      opacity: 0.75;
      margin-left: 2px;
    }

    /* Notes Drawer / Toggle */
    .row-footer {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .row-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 11px;
      cursor: pointer;
      padding: 0;
    }

    .row-btn:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .row-notes {
      margin-top: 8px;
      display: none;
    }

    .row-notes.open {
      display: block;
    }

    .notes-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--text);
      outline: none;
    }

    /* Settings Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .modal-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .platform-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .platform-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--tag-bg);
      color: var(--tag-text);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }

    .remove-tag {
      cursor: pointer;
      opacity: 0.6;
      font-weight: bold;
    }

    .remove-tag:hover {
      opacity: 1;
    }

    .add-platform-form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .add-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 13px;
      color: var(--text);
      outline: none;
    }

    .btn-add {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }

    .sync-dot.offline {
      background: #eab308;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Minimal Header -->
  <header>
    <div class="title-group">
      <h1>Stock Submissions</h1>
      <p id="statusCounter">7 projects · microstock dispatch checklist</p>
      <div class="sync-badge">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">Connecting to cloud...</span>
      </div>
    </div>
    <div class="header-links">
      <button class="btn-link" onclick="openSettings()" style="display: inline-flex; align-items: center; gap: 5px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="4" y1="21" y2="14"></line>
          <line x1="4" x2="4" y1="10" y2="3"></line>
          <line x1="12" x2="12" y1="21" y2="12"></line>
          <line x1="12" x2="12" y1="8" y2="3"></line>
          <line x1="20" x2="20" y1="21" y2="16"></line>
          <line x1="20" x2="20" y1="12" y2="3"></line>
          <line x1="2" x2="6" y1="14" y2="14"></line>
          <line x1="10" x2="14" y1="8" y2="8"></line>
          <line x1="18" x2="22" y1="16" y2="16"></line>
        </svg>
        <span>Platforms</span>
      </button>
      <a href="https://github.com/armwoottipong/Stock_automation" target="_blank" class="btn-link" style="display: inline-flex; align-items: center; gap: 5px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path>
          <path d="M9 18c-4.51 2-5-2-7-2"></path>
        </svg>
        <span>GitHub</span>
      </a>
    </div>
  </header>

  <!-- Controls Bar -->
  <div class="controls-bar">
    <div class="filter-group">
      <button class="filter-item active" onclick="setFilter('all', this)">All</button>
      <button class="filter-item" onclick="setFilter('pending', this)">Pending</button>
      <button class="filter-item" onclick="setFilter('completed', this)">Completed</button>
    </div>
    <div class="controls-right">
      <button class="sort-btn" id="sortOrderBtn" onclick="toggleSortOrder()" title="Sorted: Newest first (Click for Oldest first)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 16 4 4 4-4"></path>
          <path d="M7 20V4"></path>
          <path d="M11 4h10"></path>
          <path d="M11 8h7"></path>
          <path d="M11 12h4"></path>
        </svg>
        <span>Newest</span>
      </button>
      <input type="text" class="search-input" id="searchInput" placeholder="Search projects..." oninput="handleSearch()">
    </div>
  </div>

  <!-- Todo List -->
  <div class="todo-list" id="todoList">
    <!-- Populated by JavaScript -->
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal" onclick="handleOverlayClick(event)">
  <div class="modal-box">
    <div class="modal-title">Tracked Agencies</div>
    <div class="modal-desc">Configure platforms tracked on your submission checklist.</div>

    <div class="platform-tags" id="platformTagsList">
      <!-- Tag chips populated by JS -->
    </div>

    <form class="add-platform-form" onsubmit="handleAddPlatform(event)">
      <input type="text" class="add-input" id="newPlatformInput" placeholder="Add agency (e.g. Freepik, Vecteezy, Others)" required>
      <button type="submit" class="btn-add">+ Add</button>
    </form>

    <div id="restoreSection" style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); display: none;">
      <div style="font-size: 13px; font-weight: 600; margin-bottom: 4px;">Removed Projects</div>
      <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">Hidden from checklist. Click restore to put back in list.</div>
      <div id="deletedList" style="display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto;"></div>
    </div>

    <div class="modal-actions" style="margin-top: 16px;">
      <button class="btn-link" onclick="closeSettings()">Done</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <span id="toastIcon" style="display:inline-flex; align-items:center;"></span>
  <span id="toastMsg">Saved to Database</span>
</div>

<script>
  // Initial projects embedded by pipeline
  const INITIAL_PROJECTS = [
  {
    "id": "test_set_2026-10-02_001",
    "date": "2026-10-02",
    "created_at": "2026-10-02 10:01",
    "timestamp": 1790910089.7535203,
    "title": "test_set_2026-10-02_001",
    "catalog_title": "",
    "image_count": 1,
    "packages": [
      "adobe_stock"
    ],
    "has_csv": false,
    "has_white_jpg": false,
    "has_transparent_png": true,
    "has_contact_sheet": false,
    "keywords_sample": []
  }
];

  // Default initial agencies: Adobe Stock, Shutterstock, 123RF
  const DEFAULT_PLATFORMS = ["Adobe Stock", "Shutterstock", "123RF"];

  // LocalStorage keys
  const STORAGE_KEY = "stock_submission_checklist_v1";
  const PLATFORMS_KEY = "stock_configured_platforms_v1";
  const DELETED_KEY = "stock_deleted_projects_v1";
  const SORT_KEY = "stock_sort_order_v1";

  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDz7Dkve8Kh0JD3LXzGK1iVB3PFnlUNhCE",
    authDomain: "stock-checklist-57743.firebaseapp.com",
    projectId: "stock-checklist-57743",
    storageBucket: "stock-checklist-57743.firebasestorage.app",
    messagingSenderId: "1073765326022",
    appId: "1:1073765326022:web:dba9769de45523d0e30bc7",
    measurementId: "G-77202SNTD4"
  };

  let firestoreDb = null;
  let isCloudSyncing = false;

  let appState = {
    projects: [],
    platforms: [...DEFAULT_PLATFORMS],
    submissions: {},
    deleted_projects: [],
    currentFilter: "all",
    searchQuery: "",
    sortOrder: "desc"
  };

  function initApp() {
    loadPlatforms();
    loadSubmissions();
    loadDeletedProjects();
    loadSortOrder();
    mergeProjects(INITIAL_PROJECTS);
    tryFetchProjects();
    renderApp();
    updateSortButtonUI();
    initFirebase();
  }

  function loadSortOrder() {
    try {
      const saved = localStorage.getItem(SORT_KEY);
      if (saved === "asc" || saved === "desc") {
        appState.sortOrder = saved;
      }
    } catch (e) {}
  }

  function sortProjects() {
    const isDesc = appState.sortOrder === "desc";
    appState.projects.sort((a, b) => {
      const tA = a.timestamp || (a.created_at ? new Date(a.created_at).getTime() : 0);
      const tB = b.timestamp || (b.created_at ? new Date(b.created_at).getTime() : 0);
      return isDesc ? (tB - tA) : (tA - tB);
    });
  }

  function updateSortButtonUI() {
    const btn = document.getElementById("sortOrderBtn");
    if (!btn) return;
    const isDesc = appState.sortOrder === "desc";
    btn.title = isDesc ? "Sorted: Newest first (Click for Oldest first)" : "Sorted: Oldest first (Click for Newest first)";
    btn.innerHTML = isDesc ? `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 16 4 4 4-4"></path>
        <path d="M7 20V4"></path>
        <path d="M11 4h10"></path>
        <path d="M11 8h7"></path>
        <path d="M11 12h4"></path>
      </svg>
      <span>Newest</span>
    ` : `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 8 4-4 4 4"></path>
        <path d="M7 4v16"></path>
        <path d="M11 12h4"></path>
        <path d="M11 16h7"></path>
        <path d="M11 20h10"></path>
      </svg>
      <span>Oldest</span>
    `;
  }

  function toggleSortOrder() {
    appState.sortOrder = appState.sortOrder === "desc" ? "asc" : "desc";
    try {
      localStorage.setItem(SORT_KEY, appState.sortOrder);
    } catch (e) {}
    sortProjects();
    updateSortButtonUI();
    renderList();
    showToast(appState.sortOrder === "desc" ? "Sorted: Newest first" : "Sorted: Oldest first", "sort");
  }

  function loadDeletedProjects() {
    try {
      const raw = localStorage.getItem(DELETED_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          appState.deleted_projects = parsed;
        }
      }
    } catch (e) {
      console.error(e);
    }
  }

  function saveDeletedProjects(customToast, iconType = "cloud") {
    try {
      localStorage.setItem(DELETED_KEY, JSON.stringify(appState.deleted_projects));
      pushToCloud(customToast || "Saved to Database", iconType);
    } catch (e) {
      console.error(e);
    }
  }

  function deleteProject(setId) {
    if (!confirm(`Are you sure you want to remove "${setId}" from the checklist?`)) return;
    if (!appState.deleted_projects.includes(setId)) {
      appState.deleted_projects.push(setId);
    }
    saveDeletedProjects(`Removed ${setId}`, "trash");
    renderApp();
  }

  function restoreProject(setId) {
    appState.deleted_projects = appState.deleted_projects.filter(id => id !== setId);
    saveDeletedProjects(`Restored ${setId}`, "restore");
    renderDeletedList();
    renderApp();
  }

  function initFirebase() {
    try {
      if (typeof firebase !== "undefined" && firebaseConfig && firebaseConfig.apiKey) {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        firestoreDb = firebase.firestore();

        const docRef = firestoreDb.collection("stock_checklist").doc("state");
        docRef.onSnapshot((doc) => {
          if (doc.exists) {
            const data = doc.data();
            isCloudSyncing = true;
            if (data.submissions) {
              appState.submissions = Object.assign(appState.submissions, data.submissions);
              localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 2, submissions: appState.submissions }));
            }
            if (Array.isArray(data.platforms) && data.platforms.length > 0) {
              appState.platforms = data.platforms;
              localStorage.setItem(PLATFORMS_KEY, JSON.stringify(appState.platforms));
            }
            if (Array.isArray(data.deleted_projects)) {
              appState.deleted_projects = data.deleted_projects;
              localStorage.setItem(DELETED_KEY, JSON.stringify(appState.deleted_projects));
            }
            isCloudSyncing = false;
            setSyncStatus(true, "Firebase Real-time Synced");
            renderApp();
          } else {
            pushToCloud();
            setSyncStatus(true, "Firebase Real-time Synced");
          }
        }, (err) => {
          console.warn("Firestore error:", err.message);
          setSyncStatus(false, "Local Cache (Enable Firestore in Test Mode)");
        });
      } else {
        setSyncStatus(false, "Local Cache");
      }
    } catch (e) {
      console.warn("Firebase init error:", e);
      setSyncStatus(false, "Local Cache");
    }
  }

  function setSyncStatus(isLive, label) {
    const dot = document.getElementById("syncDot");
    const text = document.getElementById("syncText");
    if (dot && text) {
      if (isLive) {
        dot.className = "sync-dot";
      } else {
        dot.className = "sync-dot offline";
      }
      text.textContent = label;
    }
  }

  let pushTimer = null;

  function pushToCloud(customMsg, iconType = "cloud") {
    if (!firestoreDb) {
      showToast(customMsg || "Saved locally (Offline)", iconType === "cloud" ? "offline" : iconType);
      return;
    }
    if (isCloudSyncing) return;

    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(() => {
      firestoreDb.collection("stock_checklist").doc("state").set({
        submissions: appState.submissions,
        platforms: appState.platforms,
        deleted_projects: appState.deleted_projects,
        last_updated: new Date().toISOString()
      }, { merge: true })
      .then(() => {
        showToast(customMsg || "Saved to Database", iconType);
      })
      .catch(err => {
        console.warn("Cloud push warning:", err.message);
        showToast("Saved locally (Cloud offline)", "offline");
      });
    }, 120);
  }

  function loadPlatforms() {
    try {
      const raw = localStorage.getItem(PLATFORMS_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) {
          appState.platforms = parsed;
        }
      }
    } catch (e) {
      console.error(e);
    }
  }

  function savePlatforms() {
    try {
      localStorage.setItem(PLATFORMS_KEY, JSON.stringify(appState.platforms));
      pushToCloud("Agencies updated & synced", "settings");
    } catch (e) {
      console.error(e);
    }
  }

  function loadSubmissions() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        appState.submissions = parsed.submissions || parsed || {};
      }
    } catch (e) {
      console.error(e);
    }
  }

  function saveSubmissions(customToast, iconType = "cloud") {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: 2,
        submissions: appState.submissions
      }));
      pushToCloud(customToast || "Saved to Database", iconType);
    } catch (e) {
      console.error(e);
    }
  }

  function mergeProjects(newList) {
    if (!Array.isArray(newList)) return;
    newList.forEach(item => {
      const exists = appState.projects.find(p => p.id === item.id);
      if (!exists) {
        appState.projects.push(item);
      } else {
        Object.assign(exists, item);
      }
      if (!appState.submissions[item.id]) {
        appState.submissions[item.id] = { checks: {}, notes: "" };
      }
    });
    sortProjects();
  }

  async function tryFetchProjects() {
    try {
      const res = await fetch("projects.json");
      if (res.ok) {
        const data = await res.json();
        mergeProjects(data);
        renderApp();
      }
    } catch (e) {}
  }

  function togglePlatform(setId, platform) {
    if (!appState.submissions[setId]) {
      appState.submissions[setId] = { checks: {}, notes: "" };
    }
    const checks = appState.submissions[setId].checks || {};
    const cur = checks[platform] || { submitted: false, date: "" };
    
    if (cur.submitted) {
      checks[platform] = { submitted: false, date: "" };
    } else {
      const now = new Date();
      const dateStr = `${now.getMonth() + 1}/${now.getDate()}`;
      checks[platform] = { submitted: true, date: dateStr };
    }
    appState.submissions[setId].checks = checks;
    saveSubmissions();
    renderApp();
  }

  function isSetComplete(setId) {
    const checks = (appState.submissions[setId] && appState.submissions[setId].checks) || {};
    return appState.platforms.length > 0 && appState.platforms.every(p => checks[p] && checks[p].submitted);
  }

  function toggleNotes(setId) {
    const el = document.getElementById(`notes_${setId}`);
    if (el) el.classList.toggle("open");
  }

  let noteTimer = null;
  function updateNotes(setId, val) {
    if (!appState.submissions[setId]) appState.submissions[setId] = { checks: {}, notes: "" };
    appState.submissions[setId].notes = val;
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 2, submissions: appState.submissions }));
    if (noteTimer) clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      pushToCloud("Note saved to Database", "cloud");
    }, 400);
  }

  function copySetId(setId) {
    navigator.clipboard.writeText(setId).then(() => {
      showToast(`Copied ${setId}`, "copy");
    }).catch(() => {});
  }

  function setFilter(type, btn) {
    appState.currentFilter = type;
    document.querySelectorAll(".filter-item").forEach(b => b.classList.remove("active"));
    if (btn) btn.classList.add("active");
    renderList();
  }

  function handleSearch() {
    appState.searchQuery = document.getElementById("searchInput").value.trim().toLowerCase();
    renderList();
  }

  // Settings Modal Functions
  function openSettings() {
    renderPlatformTags();
    renderDeletedList();
    document.getElementById("settingsModal").classList.add("open");
  }

  function renderDeletedList() {
    const sec = document.getElementById("restoreSection");
    const list = document.getElementById("deletedList");
    if (!sec || !list) return;
    if (appState.deleted_projects.length === 0) {
      sec.style.display = "none";
      return;
    }
    sec.style.display = "block";
    list.innerHTML = appState.deleted_projects.map(id => `
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; background: var(--bg); padding: 5px 8px; border-radius: 4px; border: 1px solid var(--border);">
        <span style="font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px;">${id}</span>
        <button class="row-btn" style="color: var(--accent); font-weight: 600;" onclick="restoreProject('${id}')">Restore</button>
      </div>
    `).join("");
  }

  function closeSettings() {
    document.getElementById("settingsModal").classList.remove("open");
  }

  function handleOverlayClick(e) {
    if (e.target.id === "settingsModal") closeSettings();
  }

  function renderPlatformTags() {
    const list = document.getElementById("platformTagsList");
    list.innerHTML = appState.platforms.map((plat, idx) => `
      <div class="platform-tag">
        <span>${plat}</span>
        ${appState.platforms.length > 1 ? `
          <span class="remove-tag" onclick="removePlatform(${idx})" title="Remove platform" style="display:inline-flex; align-items:center;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </span>
        ` : ''}
      </div>
    `).join("");
  }

  function handleAddPlatform(e) {
    e.preventDefault();
    const input = document.getElementById("newPlatformInput");
    const name = input.value.trim();
    if (name && !appState.platforms.includes(name)) {
      appState.platforms.push(name);
      savePlatforms();
      renderPlatformTags();
      renderApp();
      input.value = "";
    }
  }

  function removePlatform(idx) {
    appState.platforms.splice(idx, 1);
    savePlatforms();
    renderPlatformTags();
    renderApp();
  }

  const ICONS = {
    cloud: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>',
    copy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
    trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>',
    restore: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>',
    offline: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>',
    settings: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/></svg>',
    sort: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="M11 4h10"/><path d="M11 8h7"/><path d="M11 12h4"/></svg>'
  };

  function showToast(msg, iconType = "cloud") {
    const toast = document.getElementById("toast");
    const iconEl = document.getElementById("toastIcon");
    const msgEl = document.getElementById("toastMsg");
    if (!toast) return;
    if (iconEl) iconEl.innerHTML = ICONS[iconType] || ICONS.cloud;
    if (msgEl) msgEl.textContent = msg;
    toast.classList.add("show");
    if (window._toastTimeout) clearTimeout(window._toastTimeout);
    window._toastTimeout = setTimeout(() => toast.classList.remove("show"), 2200);
  }

  function renderList() {
    const container = document.getElementById("todoList");
    const q = appState.searchQuery;

    const filtered = appState.projects.filter(p => {
      if (appState.deleted_projects.includes(p.id)) return false;
      const sub = appState.submissions[p.id] || {};
      const complete = isSetComplete(p.id);
      const text = `${p.id} ${p.title} ${p.catalog_title || ''} ${sub.notes || ''}`.toLowerCase();
      const matchesSearch = !q || text.includes(q);

      if (!matchesSearch) return false;
      if (appState.currentFilter === "pending") return !complete;
      if (appState.currentFilter === "completed") return complete;
      return true;
    });

    if (filtered.length === 0) {
      container.innerHTML = `<div style="padding:40px 0; color:var(--text-muted); font-size:14px;">No matching stock sets found.</div>`;
      return;
    }

    container.innerHTML = filtered.map(p => {
      const sub = appState.submissions[p.id] || { checks: {}, notes: "" };
      const checks = sub.checks || {};
      const complete = isSetComplete(p.id);

      return `
        <div class="todo-row ${complete ? 'all-done' : ''}">
          <div class="todo-title" onclick="copySetId('${p.id}')" title="Click to copy folder name">${p.title}</div>

          <div class="todo-meta-line">
            <span>${p.image_count} assets · ${p.created_at || p.date}${p.catalog_title ? ` · ${p.catalog_title}` : ''}</span>
            <span class="set-id" onclick="copySetId('${p.id}')" title="Click to copy folder name" style="cursor:pointer; display:inline-flex; align-items:center; gap:4px; opacity:0.8;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
              </svg>
              <span>Copy</span>
            </span>
          </div>

          <div class="platforms-checklist">
            ${appState.platforms.map(plat => {
              const item = checks[plat] || { submitted: false, date: "" };
              return `
                <div class="check-pill ${item.submitted ? 'checked' : ''}" onclick="togglePlatform('${p.id}', '${plat}')">
                  <svg class="check-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  <span>${plat}</span>
                  ${item.submitted && item.date ? `<span class="sub-date">(${item.date})</span>` : ''}
                </div>
              `;
            }).join("")}
          </div>

          <div class="row-footer">
            <button class="row-btn" onclick="toggleNotes('${p.id}')">${sub.notes ? 'Edit note' : '+ Add note'}</button>
            <button class="row-btn" style="color: var(--text-dim);" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='var(--text-dim)'" onclick="deleteProject('${p.id}')" title="Remove from checklist">Delete</button>
          </div>

          <div class="row-notes ${sub.notes ? 'open' : ''}" id="notes_${p.id}">
            <input type="text" class="notes-input" placeholder="Add note (batch number, acceptance, etc)..." value="${sub.notes || ''}" onchange="updateNotes('${p.id}', this.value)">
          </div>
        </div>
      `;
    }).join("");
  }

  function renderApp() {
    const active = appState.projects.filter(p => !appState.deleted_projects.includes(p.id));
    const total = active.length;
    const completed = active.filter(p => isSetComplete(p.id)).length;
    const pending = total - completed;
    document.getElementById("statusCounter").textContent = `${total} sets · ${pending} pending · ${completed} completed`;
    renderList();
  }

  document.addEventListener("DOMContentLoaded", initApp);
</script>
</body>
</html>
